services:
  php:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: emr-php
    container_name: php_native_app_prod
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_NAME: ${DB_NAME:-emr}
      DB_USER: ${DB_USER:-emr}
      DB_PASS: ${DB_PASS}
      APP_URL: ${APP_URL:-http://localhost:8080}
    networks:
      - devrun

networks:
  devrun:
    external: true
